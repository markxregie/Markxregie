<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" style="image-rendering:pixelated" xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- Stage background -->
  <rect width="320" height="220" fill="#0D0D1A"/>

  <!-- Stage floor -->
  <rect x="0" y="178" width="320" height="42" fill="#1A0D2E"/>
  <rect x="0" y="174" width="320" height="4" fill="#2D1B4E"/>

  <!-- Stage glow bar (SMIL flicker) -->
  <rect x="0" y="174" width="320" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0.6;1;0.7;1;0.6" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Light fixtures -->
  <rect x="20" y="48" width="12" height="9" rx="1" fill="#2D1B4E"/>
  <rect x="22" y="55" width="8" height="3" fill="#B19CD9" opacity="0.9"/>
  <rect x="148" y="42" width="12" height="9" rx="1" fill="#2D1B4E"/>
  <rect x="150" y="49" width="8" height="3" fill="#B19CD9" opacity="0.9"/>
  <rect x="283" y="48" width="12" height="9" rx="1" fill="#2D1B4E"/>
  <rect x="285" y="55" width="8" height="3" fill="#B19CD9" opacity="0.9"/>

  <!-- Light beam left (SMIL sweep) -->
  <polygon points="26,57 2,178 50,178" fill="#B19CD9" opacity="0.12">
    <animateTransform attributeName="transform" type="rotate"
      values="-12,26,57;12,26,57;-12,26,57" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="2.2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Light beam right (SMIL sweep, offset) -->
  <polygon points="289,57 265,178 313,178" fill="#B19CD9" opacity="0.12">
    <animateTransform attributeName="transform" type="rotate"
      values="12,289,57;-12,289,57;12,289,57" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </polygon>

  <!-- Center beam -->
  <polygon points="154,51 130,178 178,178" fill="#7B5EA7" opacity="0.07">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </polygon>

  <!-- LEFT AMP STACK -->
  <rect x="5" y="148" width="32" height="30" rx="1" fill="#1A1A2E" stroke="#4B2E6F" stroke-width="1"/>
  <circle cx="16" cy="158" r="7" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="158" r="7" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="9" y="168" width="24" height="2" fill="#B19CD9" opacity="0.4"/>

  <!-- RIGHT AMP STACK -->
  <rect x="283" y="148" width="32" height="30" rx="1" fill="#1A1A2E" stroke="#4B2E6F" stroke-width="1"/>
  <circle cx="294" cy="158" r="7" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="306" cy="158" r="7" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <rect x="287" y="168" width="24" height="2" fill="#B19CD9" opacity="0.4"/>

  <!-- ===== DRUMMER ===== -->
  <g>
    <!-- Kick drum (pulse) -->
    <ellipse cx="62" cy="176" rx="14" ry="8" fill="#1A0D2E" stroke="#4B2E6F" stroke-width="1">
      <animateTransform attributeName="transform" type="scale"
        values="1,1;1.06,1;1,1" dur="0.4s" additive="sum" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </ellipse>
    <ellipse cx="62" cy="176" rx="8" ry="5" fill="#2D1B4E"/>
    <!-- Snare -->
    <rect x="72" y="169" width="14" height="6" rx="1" fill="#2D1B4E" stroke="#4B2E6F" stroke-width="1"/>
    <!-- Hi-hat stand -->
    <rect x="48" y="150" width="2" height="22" rx="0" fill="#7B5EA7"/>
    <!-- Cymbal left (SMIL rotate) -->
    <rect x="42" y="148" width="14" height="3" rx="1" fill="#B19CD9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate"
        values="0,49,149;-8,49,149;4,49,149;0,49,149" dur="0.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Cymbal right (SMIL rotate, offset) -->
    <rect x="60" y="143" width="18" height="3" rx="1" fill="#D4BFFF" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate"
        values="0,69,144;-8,69,144;4,69,144;0,69,144" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Body (bob up/down) -->
    <rect x="56" y="162" width="10" height="13" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,0" dur="0.4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head (bob) -->
    <rect x="58" y="153" width="8" height="9" rx="2" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,0" dur="0.4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Left drumstick -->
    <line x1="61" y1="162" x2="50" y2="151" stroke="#D4BFFF" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate"
        values="0,61,162;-15,61,162;0,61,162" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <!-- Right drumstick -->
    <line x1="66" y1="162" x2="77" y2="151" stroke="#D4BFFF" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate"
        values="0,66,162;15,66,162;0,66,162" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== GUITARIST ===== -->
  <g>
    <!-- Body (sway) -->
    <rect x="130" y="151" width="10" height="16" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="rotate"
        values="0,135,151;-2,135,151;2,135,151;0,135,151" dur="0.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head (sway) -->
    <rect x="132" y="141" width="8" height="10" rx="2" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="rotate"
        values="0,136,141;-2,136,141;2,136,141;0,136,141" dur="0.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Guitar body -->
    <rect x="118" y="154" width="18" height="10" rx="3" fill="#B19CD9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate"
        values="0,135,159;-2,135,159;2,135,159;0,135,159" dur="0.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Guitar neck -->
    <rect x="136" y="155" width="14" height="2" fill="#2D1B4E"/>
    <rect x="136" y="158" width="14" height="2" fill="#2D1B4E"/>
    <!-- Strings -->
    <line x1="120" y1="157" x2="150" y2="157" stroke="#D4BFFF" stroke-width="0.5" opacity="0.6"/>
    <line x1="120" y1="160" x2="150" y2="160" stroke="#D4BFFF" stroke-width="0.5" opacity="0.6"/>
    <line x1="120" y1="163" x2="150" y2="163" stroke="#D4BFFF" stroke-width="0.5" opacity="0.6"/>
    <!-- Arm -->
    <line x1="132" y1="154" x2="122" y2="160" stroke="#B19CD9" stroke-width="2"/>
    <!-- Pick flash -->
    <rect x="120" y="157" width="4" height="4" rx="1" fill="#D4BFFF">
      <animate attributeName="opacity" values="0;0.8;0;0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== BASSIST ===== -->
  <g>
    <!-- Body (bob) -->
    <rect x="204" y="151" width="10" height="16" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head (bob) -->
    <rect x="206" y="141" width="8" height="10" rx="2" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Bass body -->
    <rect x="192" y="154" width="16" height="9" rx="3" fill="#7B5EA7" opacity="0.85">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Bass neck -->
    <rect x="208" y="155" width="18" height="2" fill="#2D1B4E"/>
    <rect x="208" y="158" width="18" height="2" fill="#2D1B4E"/>
    <!-- Bass strings -->
    <line x1="194" y1="157" x2="226" y2="157" stroke="#D4BFFF" stroke-width="0.5" opacity="0.6"/>
    <line x1="194" y1="161" x2="226" y2="161" stroke="#D4BFFF" stroke-width="0.5" opacity="0.6"/>
    <!-- Arm -->
    <line x1="206" y1="154" x2="196" y2="160" stroke="#B19CD9" stroke-width="2"/>
  </g>

  <!-- ===== VOCALIST ===== -->
  <g>
    <!-- Body (sway) -->
    <rect x="263" y="151" width="10" height="16" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="rotate"
        values="0,268,151;-3,268,151;3,268,151;0,268,151" dur="0.7s" begin="0.1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head (sway) -->
    <rect x="265" y="140" width="8" height="11" rx="3" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="rotate"
        values="0,269,140;-3,269,140;3,269,140;0,269,140" dur="0.7s" begin="0.1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Mic stand -->
    <rect x="268" y="143" width="2" height="14" rx="0" fill="#B19CD9" opacity="0.85"/>
    <!-- Mic head -->
    <ellipse cx="269" cy="143" rx="5" ry="3.5" fill="#B19CD9" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Mic cable -->
    <path d="M269 157 Q263 165 258 172" fill="none" stroke="#4B2E6F" stroke-width="1.5"/>
    <!-- Raised arm -->
    <line x1="265" y1="154" x2="270" y2="146" stroke="#B19CD9" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        values="0,265,154;-5,265,154;5,265,154;0,265,154" dur="0.7s" begin="0.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Pixel sparks / ambient dots -->
  <rect x="98" y="68" width="2" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.7;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="222" y="78" width="2" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="172" y="62" width="2" height="2" fill="#D4BFFF">
    <animate attributeName="opacity" values="0;0.8;0" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="80" y="90" width="2" height="2" fill="#D4BFFF">
    <animate attributeName="opacity" values="0;0.5;0" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="252" y="73" width="2" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="140" y="95" width="2" height="2" fill="#7B5EA7">
    <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Floor label -->
  <rect x="90" y="188" width="140" height="16" fill="#0A0814"/>
  <text x="160" y="200" font-family="Courier New, monospace" font-size="7" fill="#B19CD9"
    text-anchor="middle" font-weight="bold" letter-spacing="2">// THE STACK //</text>

</svg>
