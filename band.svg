<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" style="image-rendering:pixelated" xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- Stage background -->
  <rect width="760" height="200" fill="#0D0D1A"/>

  <!-- Stage floor -->
  <rect x="0" y="162" width="760" height="38" fill="#1A0D2E"/>
  <rect x="0" y="158" width="760" height="4" fill="#2D1B4E"/>

  <!-- Stage glow bar -->
  <rect x="0" y="158" width="760" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0.6;1;0.7;1;0.6" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Light fixtures -->
  <rect x="60" y="28" width="14" height="10" rx="1" fill="#2D1B4E"/>
  <rect x="62" y="36" width="10" height="3" fill="#B19CD9" opacity="0.9"/>

  <rect x="220" y="20" width="14" height="10" rx="1" fill="#2D1B4E"/>
  <rect x="222" y="28" width="10" height="3" fill="#B19CD9" opacity="0.9"/>

  <rect x="380" y="16" width="14" height="10" rx="1" fill="#2D1B4E"/>
  <rect x="382" y="24" width="10" height="3" fill="#B19CD9" opacity="0.9"/>

  <rect x="540" y="20" width="14" height="10" rx="1" fill="#2D1B4E"/>
  <rect x="542" y="28" width="10" height="3" fill="#B19CD9" opacity="0.9"/>

  <rect x="686" y="28" width="14" height="10" rx="1" fill="#2D1B4E"/>
  <rect x="688" y="36" width="10" height="3" fill="#B19CD9" opacity="0.9"/>

  <!-- Light beams -->
  <polygon points="67,38 30,160 104,160" fill="#B19CD9" opacity="0.09">
    <animateTransform attributeName="transform" type="rotate" values="-10,67,38;10,67,38;-10,67,38" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.18;0.07" dur="2.4s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="227,28 190,160 264,160" fill="#B19CD9" opacity="0.09">
    <animateTransform attributeName="transform" type="rotate" values="10,227,28;-10,227,28;10,227,28" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.18;0.07" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="387,24 350,160 424,160" fill="#7B5EA7" opacity="0.08">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="547,28 510,160 584,160" fill="#B19CD9" opacity="0.09">
    <animateTransform attributeName="transform" type="rotate" values="-10,547,28;10,547,28;-10,547,28" dur="2.1s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.18;0.07" dur="2.1s" begin="1.0s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="693,38 656,160 730,160" fill="#B19CD9" opacity="0.09">
    <animateTransform attributeName="transform" type="rotate" values="10,693,38;-10,693,38;10,693,38" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.07;0.18;0.07" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </polygon>

  <!-- LEFT AMP STACK -->
  <rect x="10" y="128" width="36" height="32" rx="1" fill="#1A1A2E" stroke="#4B2E6F" stroke-width="1"/>
  <circle cx="22" cy="140" r="8" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="140" r="8" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="13" y="151" width="30" height="2" fill="#B19CD9" opacity="0.4"/>

  <!-- RIGHT AMP STACK -->
  <rect x="714" y="128" width="36" height="32" rx="1" fill="#1A1A2E" stroke="#4B2E6F" stroke-width="1"/>
  <circle cx="726" cy="140" r="8" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="140" r="8" fill="#7B5EA7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="0.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <rect x="717" y="151" width="30" height="2" fill="#B19CD9" opacity="0.4"/>

  <!-- ===== DRUMMER (x~140) ===== -->
  <g>
    <ellipse cx="148" cy="158" rx="18" ry="9" fill="#1A0D2E" stroke="#4B2E6F" stroke-width="1">
      <animateTransform attributeName="transform" type="scale" values="1,1;1.05,1;1,1" dur="0.4s" additive="sum" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </ellipse>
    <ellipse cx="148" cy="158" rx="10" ry="6" fill="#2D1B4E"/>
    <rect x="166" y="150" width="16" height="7" rx="1" fill="#2D1B4E" stroke="#4B2E6F" stroke-width="1"/>
    <!-- Hi-hat stand -->
    <rect x="124" y="128" width="2" height="28" rx="0" fill="#7B5EA7"/>
    <!-- Cymbal left -->
    <rect x="115" y="126" width="18" height="4" rx="1" fill="#B19CD9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0,124,128;-9,124,128;4,124,128;0,124,128" dur="0.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Cymbal right -->
    <rect x="136" y="120" width="22" height="4" rx="1" fill="#D4BFFF" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0,147,122;-9,147,122;4,147,122;0,147,122" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Body bob -->
    <rect x="140" y="142" width="14" height="16" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head bob -->
    <rect x="143" y="130" width="10" height="12" rx="2" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Drumstick left -->
    <line x1="145" y1="142" x2="128" y2="128" stroke="#D4BFFF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0,145,142;-18,145,142;0,145,142" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <!-- Drumstick right -->
    <line x1="153" y1="142" x2="170" y2="128" stroke="#D4BFFF" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0,153,142;18,153,142;0,153,142" dur="0.4s" begin="0.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== GUITARIST (x~300) ===== -->
  <g>
    <!-- Body sway -->
    <rect x="296" y="132" width="14" height="20" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="rotate" values="0,303,132;-2,303,132;2,303,132;0,303,132" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head -->
    <rect x="298" y="118" width="12" height="14" rx="3" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="rotate" values="0,304,118;-2,304,118;2,304,118;0,304,118" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Guitar body -->
    <rect x="278" y="136" width="24" height="13" rx="4" fill="#B19CD9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0,303,142;-2,303,142;2,303,142;0,303,142" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Guitar neck -->
    <rect x="302" y="137" width="26" height="3" fill="#2D1B4E"/>
    <rect x="302" y="142" width="26" height="3" fill="#2D1B4E"/>
    <!-- Strings -->
    <line x1="280" y1="140" x2="328" y2="140" stroke="#D4BFFF" stroke-width="0.6" opacity="0.6"/>
    <line x1="280" y1="143" x2="328" y2="143" stroke="#D4BFFF" stroke-width="0.6" opacity="0.6"/>
    <line x1="280" y1="146" x2="328" y2="146" stroke="#D4BFFF" stroke-width="0.6" opacity="0.6"/>
    <!-- Arm -->
    <line x1="298" y1="136" x2="283" y2="144" stroke="#B19CD9" stroke-width="2.5"/>
    <!-- Pick flash -->
    <rect x="280" y="139" width="5" height="5" rx="1" fill="#D4BFFF">
      <animate attributeName="opacity" values="0;0.9;0;0.9;0" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== BASSIST (x~460) ===== -->
  <g>
    <!-- Body bob -->
    <rect x="454" y="132" width="14" height="20" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head -->
    <rect x="456" y="118" width="12" height="14" rx="3" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Bass body -->
    <rect x="434" y="136" width="22" height="12" rx="4" fill="#7B5EA7" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,-2;0,0" dur="0.5s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Bass neck (longer) -->
    <rect x="456" y="137" width="32" height="3" fill="#2D1B4E"/>
    <rect x="456" y="142" width="32" height="3" fill="#2D1B4E"/>
    <!-- Bass strings -->
    <line x1="436" y1="140" x2="488" y2="140" stroke="#D4BFFF" stroke-width="0.6" opacity="0.6"/>
    <line x1="436" y1="145" x2="488" y2="145" stroke="#D4BFFF" stroke-width="0.6" opacity="0.6"/>
    <!-- Arm -->
    <line x1="456" y1="136" x2="440" y2="144" stroke="#B19CD9" stroke-width="2.5"/>
  </g>

  <!-- ===== VOCALIST (x~610) ===== -->
  <g>
    <!-- Body sway -->
    <rect x="604" y="132" width="14" height="20" rx="1" fill="#2D1B4E">
      <animateTransform attributeName="transform" type="rotate" values="0,611,132;-3,611,132;3,611,132;0,611,132" dur="0.7s" begin="0.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Head -->
    <rect x="606" y="116" width="12" height="16" rx="4" fill="#7B5EA7">
      <animateTransform attributeName="transform" type="rotate" values="0,612,116;-3,612,116;3,612,116;0,612,116" dur="0.7s" begin="0.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <!-- Mic stand -->
    <rect x="611" y="118" width="2.5" height="18" fill="#B19CD9" opacity="0.85"/>
    <!-- Mic head -->
    <ellipse cx="612" cy="117" rx="7" ry="4.5" fill="#B19CD9" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Mic cable -->
    <path d="M612 136 Q604 145 596 156" fill="none" stroke="#4B2E6F" stroke-width="1.5"/>
    <!-- Raised arm -->
    <line x1="606" y1="135" x2="612" y2="122" stroke="#B19CD9" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0,606,135;-6,606,135;6,606,135;0,606,135" dur="0.7s" begin="0.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Pixel sparks -->
  <rect x="200" y="55" width="3" height="3" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="560" y="65" width="3" height="3" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="380" y="48" width="3" height="3" fill="#D4BFFF">
    <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="78" width="2" height="2" fill="#D4BFFF">
    <animate attributeName="opacity" values="0;0.5;0" dur="1.5s" begin="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="660" y="72" width="2" height="2" fill="#B19CD9">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="80" width="2" height="2" fill="#7B5EA7">
    <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="440" y="58" width="2" height="2" fill="#7B5EA7">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floor label -->
  <rect x="290" y="170" width="180" height="18" fill="#0A0814"/>
  <text x="380" y="183" font-family="Courier New, monospace" font-size="8" fill="#B19CD9"
    text-anchor="middle" font-weight="bold" letter-spacing="3">// THE STACK //</text>

</svg>
